PLG_SYSTEM_PERSONYZE="System - Personyze"
PLG_SYSTEM_PERSONYZE_XML_DESCRIPTION="Adds the Personyze personalization tag to every page of the site. Enter your Personyze account ID below. The tag is not added to the administrator, and nothing is added until an account ID is set."
PLG_SYSTEM_PERSONYZE_ACCOUNT_ID_LABEL="Personyze account ID"
PLG_SYSTEM_PERSONYZE_ACCOUNT_ID_DESC="In Personyze, go to Settings then Tracking Code; the account ID is the number in the snippet. Leave this empty and no tag is added."
PLG_SYSTEM_PERSONYZE_TRACKING_DOMAINS_LABEL="Tracking domains"
PLG_SYSTEM_PERSONYZE_TRACKING_DOMAINS_DESC="Only needed when one Personyze account tracks several domains, and Personyze support has told you what to put here. Otherwise leave it empty."
